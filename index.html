<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logistikspiel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="src/css/style.css" />
</head>
<body>
  <div id="map"></div>
  <div class="ui-panel">
    <div class="panel-header">
      <h3>Logistikspiel</h3>
    </div>
    <div class="panel-data">
      <div class="data-row">
        <span class="label">Geld:</span>
        <span id="moneyValue" class="value">€ 0,00</span>
      </div>
      <div class="data-row">
        <span class="label">Datum:</span>
        <span id="dateValue" class="value">01.01.2024</span>
      </div>
    </div>
    <div class="panel-buttons">
      <button class="nav-btn">Firma</button>
      <button class="nav-btn">Fahrzeuge</button>
      <button class="nav-btn">Mitarbeiter</button>
      <button class="nav-btn">Aufträge</button>
    </div>
  </div>
  <div class="map-controls">
    <button id="randomRouteBtn">Zufällige Route</button>
    <div id="routeInfo" class="route-info">Klicke auf den Button, um zwei Punkte in Hamburg zu wählen.</div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="src/js/main.js"></script>
</body>
</html>
